<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>tictactoe-pwa</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Τριλιζά</h1>

    <div class="scores">
      <div>X: <span id="scoreX">0</span></div>
      <div>O: <span id="scoreO">0</span></div>
    </div>

    <p id="status">Παίζει: X</p>

    <div class="board" id="board" aria-label="Board"></div>

    <div class="buttons">
      <button id="newGameBtn">Νέα παρτίδα</button>
      <button id="resetScoreBtn">Reset Score</button>
    </div>

    <div id="updateBanner" class="update-banner hidden">
      <span>Υπάρχει νέα έκδοση.</span>
      <button id="updateBtn">Ενημέρωση</button>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
